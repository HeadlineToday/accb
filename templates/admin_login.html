{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <h2>Admin Login</h2>
  <form method="post">
    <label>Email</label>
    <input name="email" type="email" required>
    <label>Password</label>
    <input name="password" type="password" required>
    <button class="btn primary" type="submit">Login</button>
  </form>
</div>
{% endblock %}
