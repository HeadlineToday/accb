{% extends "base.html" %}
{% block content %}
  <h2>Search results for "{{ query }}"</h2>
  {% if results|length == 0 %}
    <p>No active posts found.</p>
  {% else %}
    <div class="feed">
      {% for p in results %}
        {% include "_post.html" %}
      {% endfor %}
    </div>
  {% endif %}
{% endblock %}
