{% extends "base.html" %}
{% block content %}
  <h2>Search results for "{{ query }}"</h2>
  {% if results|length == 0 %}
    <p>No active posts found.</p>
  {% else %}
    <ul>
      {% for post in results %}
        {% include "_post.html" %}
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
