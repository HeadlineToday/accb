{% extends "base.html" %}
{% block content %}
  <section class="search-header">
    <h2>Search results for "{{ query }}"</h2>
  </section>

  {% if results %}
    <div class="feed">
      {% for post in results %}
        {% include "post_card.html" with context %}
      {% endfor %}
    </div>
  {% else %}
    <p>No active posts found.</p>
  {% endif %}
{% endblock %}
